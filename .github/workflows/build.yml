name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# Pinned fakelua commit (post-v2.0.0 master; must include fakelua #33 for `flua --once`). It must also
# permit native table mutation: the demos keep their cross-frame state in a
# new_global_obj NativeObject, and older FakeLua rejects those writes with
# "attempt to modify a const table". Heavy deps (boost, libevent,
# hiredis, mariadb connector, tinycc, ...) are fetched by CPM; only OpenSSL
# and a C++23 compiler are expected from the runner/system packages.
env:
  FAKELUA_REF: 9f7216e0e9904d7cd05bbc4109fc22caf6ca57da

jobs:
  # Linux owns GPU coverage (xvfb + llvmpipe) and produces the generated
  # demo maps that the other OSes consume for their Lua logic runs.
  assets:
    name: linux build + assets + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache xvfb \
            libssl-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-fakelua
          max-size: 2G

      - name: Cache paths
        run: |
          echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"
          echo "FLINSTALL=$RUNNER_TEMP/flinstall" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/CPM"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: Linux-cpm-v2
          restore-keys: |
            Linux-cpm-

      - name: Checkout fakelua
        run: |
          git clone --no-checkout https://github.com/esrrhs/fakelua "$RUNNER_TEMP/fakelua-src"
          git -C "$RUNNER_TEMP/fakelua-src" fetch --depth 1 origin "$FAKELUA_REF"
          git -C "$RUNNER_TEMP/fakelua-src" checkout FETCH_HEAD

      - name: Build + install fakelua
        run: |
          set -eux
          cmake -S "$RUNNER_TEMP/fakelua-src" -B "$RUNNER_TEMP/flbuild" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFAKELUA_BUILD_TESTS=OFF \
            -DFAKELUA_BUILD_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX="$FLINSTALL"
          cmake --build "$RUNNER_TEMP/flbuild" --parallel
          cmake --install "$RUNNER_TEMP/flbuild"
          ccache -s || true

      - name: Configure fake2d
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dfakelua_DIR="$FLINSTALL/lib/cmake/fakelua"

      - name: Build fake2d
        run: cmake --build build --parallel

      - name: Binary smoke
        run: test -x build/bin/fake2d_hello

      # Compile the Steamworks branch against tests/fake_steam: the SDK code
      # path must stay buildable even though CI has no proprietary SDK.
      - name: Steamworks adapter header check
        run: |
          cmake -S . -B "$RUNNER_TEMP/steam-check" -G Ninja \
            -DFAKE2D_WITH_FAKELUA=OFF \
            -DFAKE2D_BUILD_EXAMPLES=OFF \
            -DFAKE2D_TEST_STEAM_HEADERS=ON
          cmake --build "$RUNNER_TEMP/steam-check" \
            --target fake2d_steam_compile_check

      - name: Generate demo assets
        run: |
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          for demo in mario platformer slope; do
            xvfb-run -a -s '-screen 0 1024x768x24' \
              env LIBGL_ALWAYS_SOFTWARE=1 \
              ./build/bin/fake2d_hello --headless --frames 1 "--$demo-demo"
          done
          test -s assets/mario.json && test -s assets/platformer.json \
            && test -s assets/slope.json

      - uses: actions/upload-artifact@v4
        with:
          name: demo-assets
          path: |
            assets/mario.json
            assets/platformer.json
            assets/slope.json

      - name: Headless Lua gameplay fixtures (tcc/gcc/interp)
        run: |
          python3 tests/headless/run_headless.py \
            --flua "$FLINSTALL/bin/flua"

      - name: Headless demo + benchmark smoke
        run: |
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          run_xvfb() {
            xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 "$@"
          }
          run_xvfb ./build/bin/fake2d_hello --headless --frames 30 --scene-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 40 --scene-demo \
            --screenshot scene.png
          test -s scene.png
          run_xvfb ./build/bin/fake2d_hello --headless --frames 60 --text-demo \
            --screenshot text.png --shot-min-colors 12
          test -s text.png
          run_xvfb ./build/bin/fake2d_hello --headless --bench
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --tile-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --map-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 180 --platformer-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 180 --mario-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --slope-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --path-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --rt-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --ui-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --ui2-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --ui3-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --post-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --fx-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --fog-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --audio-demo
          run_xvfb ./build/bin/fake2d_hello --headless --frames 120 --spatial-demo
          run_xvfb ./build/bin/fake2d_hello --headless --phys-bench

      - name: Physics query self-test + Lua binding test
        run: |
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          # Headless still glfwInit()s on Linux, so every engine invocation
          # needs the Xvfb/llvmpipe wrapper.
          run_xvfb() {
            xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 "$@"
          }
          # Pure CPU: ray casts / overlaps / contact lifecycle, exit code gate.
          set +e
          run_xvfb ./build/bin/fake2d_hello --phys-query-test
          rc_query=$?
          # Category/mask collision filtering (exit code gate; the summary
          # line pins the assertion count).
          run_xvfb ./build/bin/fake2d_hello --phys-filter-test > phys_filter.log 2>&1
          rc_filter=$?
          # Rigid-body solver: rotation, inertia, friction, stacks (exit code gate).
          run_xvfb ./build/bin/fake2d_hello --phys-rigid-test > phys_rigid.log 2>&1
          rc_rigid=$?
          # Kinematic bodies, sleeping, joints and anti-tunneling (exit code gate).
          run_xvfb ./build/bin/fake2d_hello --phys-extended-test > phys_extended.log 2>&1
          rc_extended=$?
          # Angry Birds demo smoke: slingshot, stacks, contact-driven scoring.
          run_xvfb ./build/bin/fake2d_hello --headless --angry-birds-demo --frames 240 > birds.log 2>&1
          rc_birds=$?
          # LIMBO demo smoke: ragdoll + rope + bridge + water + severing.
          run_xvfb ./build/bin/fake2d_hello --headless --limbo-demo --frames 240 > limbo.log 2>&1
          rc_limbo=$?
          # Fixed-step accumulator + camera tools (exit code gate).
          run_xvfb ./build/bin/fake2d_hello --timestep-test > timestep.log 2>&1
          rc_timestep=$?
          # Tilemap A* (exit code gate; the summary line pins the assertion count).
          run_xvfb ./build/bin/fake2d_hello --path-test > path.log 2>&1
          rc_path=$?
          # Offscreen render targets (exit code gate; the summary line pins
          # the assertion count).
          run_xvfb ./build/bin/fake2d_hello --rt-test > rt.log 2>&1
          rc_rt=$?
          # Immediate-mode UI widgets (exit code gate; the summary line pins
          # the assertion count).
          run_xvfb ./build/bin/fake2d_hello --ui-test > ui.log 2>&1
          rc_ui=$?
          # Post pass + minimap bake (exit code gate; the summary line pins
          # the assertion count).
          run_xvfb ./build/bin/fake2d_hello --post-test > post.log 2>&1
          rc_post=$?
          # Multi-pass chain (exit code gate; the summary line pins the
          # assertion count).
          run_xvfb ./build/bin/fake2d_hello --fx-test > fx.log 2>&1
          rc_fx=$?
          # Mask compositing (exit code gate; the summary line pins the
          # assertion count).
          run_xvfb ./build/bin/fake2d_hello --fog-test > fog.log 2>&1
          rc_fog=$?
          # Mixer self-test driving Mix() directly, no device (exit code
          # gate; the summary line pins the assertion count).
          run_xvfb ./build/bin/fake2d_hello --audio-test > audio.log 2>&1
          rc_audio=$?
          # Tiled objectgroup parsing + object/property readers (exit code
          # gate; the summary line pins the assertion count).
          run_xvfb ./build/bin/fake2d_hello --map-object-test > map_object.log 2>&1
          rc_mapobj=$?
          # Tiled tileset animation (exit code gate; the summary line pins
          # the assertion count).
          run_xvfb ./build/bin/fake2d_hello --tile-test > tile.log 2>&1
          rc_tile=$?
          # UTF-8/CJK glyph atlas, wrapping, rotation and shrink-to-fit (exit
          # code gate; SKIPs CJK cases on runners without a CJK font).
          run_xvfb ./build/bin/fake2d_hello --font-test > font.log 2>&1
          rc_font=$?
          # i18n, app paths, save containers v2, Steam stub, UI text tools
          # (exit code gate; the summary line pins the assertion count).
          run_xvfb ./build/bin/fake2d_hello --platform-test > platform.log 2>&1
          rc_platform=$?
          # RNG, easing, entity snapshots, input actions, window/text helpers
          # (exit code gate; the summary line pins the assertion count).
          run_xvfb ./build/bin/fake2d_hello --gameplay-test > gameplay.log 2>&1
          rc_gameplay=$?
          # Time scale/hit-stop, 16-slot actors and the 128-clip pool.
          run_xvfb ./build/bin/fake2d_hello --combat-test > combat.log 2>&1
          rc_combat=$?
          # Shooter sprite sheets and nearest-filter loading.
          run_xvfb ./build/bin/fake2d_hello --shmup-test > shmup.log 2>&1
          rc_shmup=$?
          # Shipped art tree: every committed PNG the game demos render from.
          run_xvfb ./build/bin/fake2d_hello --art-test > art.log 2>&1
          rc_art=$?
          # Demo launcher catalogue: unique flags, known categories, real scripts.
          run_xvfb ./build/bin/fake2d_hello --launcher-test > launcher.log 2>&1
          rc_launcher=$?
          # Snooker ball sprite: shading/alpha probes and loader rejection.
          run_xvfb ./build/bin/fake2d_hello --snooker-test > snooker.log 2>&1
          rc_snooker=$?
          # Run-and-gun art: soldier strips, blast sheet, moon/glow probes.
          run_xvfb ./build/bin/fake2d_hello --contra-test > contra.log 2>&1
          rc_contra=$?
          # City builder scaffolding: tileset/building atlas and base map.
          run_xvfb ./build/bin/fake2d_hello --city-test > city.log 2>&1
          rc_city=$?
          # RTS scaffolding: terrain/unit/building sprites and battle map.
          run_xvfb ./build/bin/fake2d_hello --rts-test > rts.log 2>&1
          rc_rts=$?
          # Visual-novel art: backgrounds, portraits, alpha probes.
          run_xvfb ./build/bin/fake2d_hello --vn-test > vn.log 2>&1
          rc_vn=$?
          # Launcher: the menu renders from shipped art, and a picked demo
          # requests the relaunch the host would honour with a fresh process.
          LAUNCHER_TEST_PICK=3 run_xvfb ./build/bin/fake2d_hello --headless --frames 40 \
            --launcher --screenshot launcher.png --shot-min-colors 12 \
            > launcher_demo.log 2>&1
          rc_launcher_demo=$?
          test -s launcher.png
          grep -q "launcher: starting platformer" launcher_demo.log
          grep -q "would restart with --platformer-demo" launcher_demo.log
          # Filtering narrows the list, and a row click commits what it covers.
          LAUNCHER_TEST_CAT=2 LAUNCHER_TEST_PICK=0 run_xvfb ./build/bin/fake2d_hello \
            --headless --frames 40 --launcher > launcher_filter.log 2>&1
          grep -q "launcher: filter engine" launcher_filter.log
          grep -q "launcher: starting scene" launcher_filter.log
          LAUNCHER_TEST_MX=100 LAUNCHER_TEST_MY=241 LAUNCHER_TEST_CLICK=10 run_xvfb \
            ./build/bin/fake2d_hello --headless --frames 40 --launcher \
            > launcher_click.log 2>&1
          grep -q "launcher: starting beat-em-up" launcher_click.log
          # Brawler demo: waves, hit detection and a full headless stage run.
          run_xvfb ./build/bin/fake2d_hello --headless --frames 240 \
            --beat-em-up-demo --screenshot beat.png --shot-min-colors 12 \
            > beat.log 2>&1
          rc_beat=$?
          test -s beat.png
          # Vertical shooter: scrolling stage, waves and bullet patterns.
          run_xvfb ./build/bin/fake2d_hello --headless --frames 240 \
            --shmup-demo --screenshot shmup.png --shot-min-colors 12 \
            > shmup_demo.log 2>&1
          rc_shmup_demo=$?
          test -s shmup.png
          # Snooker: a full rack, cue strike, cushions, pockets and the AI.
          run_xvfb ./build/bin/fake2d_hello --headless --frames 900 \
            --snooker-demo --screenshot snooker.png --shot-frame 500 \
            --shot-min-colors 12 > snooker_demo.log 2>&1
          rc_snooker_demo=$?
          test -s snooker.png
          # Run-and-gun: the attract AI crosses the jungle, clears the boss and
          # loops the stage; the log proves the whole stage flow ran.
          run_xvfb ./build/bin/fake2d_hello --headless --frames 2500 \
            --contra-demo --screenshot contra.png --shot-frame 1800 \
            --shot-min-colors 12 > contra_demo.log 2>&1
          rc_contra_demo=$?
          test -s contra.png
          grep -F "contra: fortress core destroyed" contra_demo.log
          grep -F "snooker: shot 1 resolved" snooker_demo.log
          # City builder: the attract mayor paves, zones and powers a town; a
          # population milestone proves the monthly simulation is developing it.
          run_xvfb ./build/bin/fake2d_hello --headless --frames 1800 \
            --city-demo --screenshot city.png --shot-frame 1600 \
            --shot-min-colors 12 > city_demo.log 2>&1
          rc_city_demo=$?
          test -s city.png
          grep -F "city: population milestone 250" city_demo.log
          # RTS: the attract commander and enemy AI fight a full match; the
          # logs prove combat, losses and a decisive command-yard kill.
          run_xvfb ./build/bin/fake2d_hello --headless --frames 2400 \
            --rts-demo --screenshot rts.png --shot-frame 1950 \
            --shot-min-colors 12 > rts_demo.log 2>&1
          rc_rts_demo=$?
          test -s rts.png
          grep -F "rts: first blood" rts_demo.log
          grep -F "rts: player victory" rts_demo.log
          # Visual novel: the attract player advances the calendar, chats,
          # reaches the festival and finishes a confession ending.
          run_xvfb ./build/bin/fake2d_hello --headless --frames 2400 \
            --vn-demo --screenshot vn.png --shot-frame 1200 \
            --shot-min-colors 12 > vn_demo.log 2>&1
          rc_vn_demo=$?
          test -s vn.png
          grep -F "vn: day 7" vn_demo.log
          grep -F "vn: ending" vn_demo.log
          # Same surface through the Lua bindings; PASS is the [script] 0 line.
          # Capture BOTH streams: under xvfb-run the child's stderr is not
          # reliably caught by a bare `2>` redirection.
          run_xvfb ./build/bin/fake2d_hello --headless --frames 200 \
            --entry scripts/phys_test.lua > phys_test.log 2>&1
          rc_lua=$?
          set -e
          echo "exit codes: query=$rc_query filter=$rc_filter rigid=$rc_rigid extended=$rc_extended birds=$rc_birds limbo=$rc_limbo timestep=$rc_timestep path=$rc_path rt=$rc_rt ui=$rc_ui post=$rc_post fx=$rc_fx fog=$rc_fog audio=$rc_audio mapobj=$rc_mapobj tile=$rc_tile font=$rc_font platform=$rc_platform gameplay=$rc_gameplay combat=$rc_combat shmup=$rc_shmup art=$rc_art launcher=$rc_launcher snooker=$rc_snooker contra=$rc_contra city=$rc_city rts=$rc_rts vn=$rc_vn beat=$rc_beat shmupdemo=$rc_shmup_demo snookerdemo=$rc_snooker_demo contrademo=$rc_contra_demo citydemo=$rc_city_demo rtsdemo=$rc_rts_demo vndemo=$rc_vn_demo lua=$rc_lua"
          [ "$rc_query" -eq 0 ]
          [ "$rc_filter" -eq 0 ]
          [ "$rc_rigid" -eq 0 ]
          [ "$rc_extended" -eq 0 ]
          [ "$rc_birds" -eq 0 ]
          [ "$rc_limbo" -eq 0 ]
          [ "$rc_timestep" -eq 0 ]
          [ "$rc_path" -eq 0 ]
          [ "$rc_rt" -eq 0 ]
          [ "$rc_ui" -eq 0 ]
          [ "$rc_post" -eq 0 ]
          [ "$rc_fx" -eq 0 ]
          [ "$rc_fog" -eq 0 ]
          [ "$rc_audio" -eq 0 ]
          [ "$rc_mapobj" -eq 0 ]
          [ "$rc_tile" -eq 0 ]
          [ "$rc_font" -eq 0 ]
          [ "$rc_platform" -eq 0 ]
          [ "$rc_gameplay" -eq 0 ]
          [ "$rc_combat" -eq 0 ]
          [ "$rc_shmup" -eq 0 ]
          [ "$rc_art" -eq 0 ]
          [ "$rc_launcher" -eq 0 ]
          [ "$rc_snooker" -eq 0 ]
          [ "$rc_contra" -eq 0 ]
          [ "$rc_city" -eq 0 ]
          [ "$rc_rts" -eq 0 ]
          [ "$rc_vn" -eq 0 ]
          [ "$rc_beat" -eq 0 ]
          [ "$rc_shmup_demo" -eq 0 ]
          [ "$rc_snooker_demo" -eq 0 ]
          [ "$rc_contra_demo" -eq 0 ]
          [ "$rc_city_demo" -eq 0 ]
          [ "$rc_rts_demo" -eq 0 ]
          [ "$rc_vn_demo" -eq 0 ]
          [ "$rc_lua" -eq 0 ]
          grep -F "[phys-filter] PASS" phys_filter.log
          grep -F "[phys-rigid] PASS" phys_rigid.log
          grep -F "[phys-extended] PASS" phys_extended.log
          grep -F "[timestep] PASS" timestep.log
          grep -F "[path] PASS" path.log
          grep -F "[map-obj] PASS" map_object.log
          grep -F "[tile] PASS" tile.log
          grep -F "[rt] PASS" rt.log
          grep -F "[ui] PASS" ui.log
          grep -F "[post] PASS" post.log
          grep -F "[fx] PASS" fx.log
          grep -F "[fog] PASS" fog.log
          grep -F "[audio] PASS" audio.log
          grep -F "[font] PASS" font.log
          grep -F "[platform] PASS" platform.log
          grep -F "[gameplay] PASS" gameplay.log
          grep -F "[combat] PASS" combat.log
          grep -F "[shmup] PASS" shmup.log
          grep -F "[snooker] PASS" snooker.log
          grep -F "[contra] PASS" contra.log
          grep -F "[city] PASS" city.log
          grep -F "[rts] PASS" rts.log
          grep -F "[vn] PASS" vn.log
          ! grep -F "beat-em-up: game over" beat.log
          grep -F "[script] 0" phys_test.log
          ! grep -E "\[script] (10[0-9][0-9]|200[0-9])" phys_test.log

  # macOS and Windows build the full fakelua-enabled engine and run the 24
  # Lua logic cases against Linux-produced maps. GitHub macOS VMs have no
  # NSOpenGL pixel format (GLFW 65545), so no engine runs there; Windows
  # installs Mesa llvmpipe (tools/setup-mesa-windows.ps1) for software GL.
  engine:
    name: engine (${{ matrix.label }})
    needs: assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos
          - os: windows-2022
            label: windows

    steps:
      - uses: actions/checkout@v4

      - name: (macos) packages
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja ccache openssl@3 || true
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: (macos) ccache
        if: runner.os == 'macOS'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-fakelua
          max-size: 2G

      - name: (macos) cache paths
        if: runner.os == 'macOS'
        run: |
          echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"
          echo "FLINSTALL=$RUNNER_TEMP/flinstall" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/CPM"

      - name: (macos) cache CPM
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: macOS-cpm-v2
          restore-keys: |
            macOS-cpm-

      - name: (windows) MSYS2 toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-python

      - name: (windows) paths
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          mkdir -p .cache/CPM .cache/ccache
          echo "CPM_SOURCE_CACHE=$(cygpath -w "$GITHUB_WORKSPACE/.cache/CPM")" >> "$GITHUB_ENV"
          echo "FLINSTALL=$(cygpath -w "$GITHUB_WORKSPACE/../flinstall")" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$(cygpath -w "$GITHUB_WORKSPACE/.cache/ccache")" >> "$GITHUB_ENV"

      - name: (windows) cache CPM/ccache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .cache
          key: windows-cpm-ccache-v2
          restore-keys: |
            windows-cpm-ccache-

      - name: (macos) checkout fakelua
        if: runner.os == 'macOS'
        run: |
          git clone --no-checkout https://github.com/esrrhs/fakelua "$RUNNER_TEMP/fakelua-src"
          git -C "$RUNNER_TEMP/fakelua-src" fetch --depth 1 origin "$FAKELUA_REF"
          git -C "$RUNNER_TEMP/fakelua-src" checkout FETCH_HEAD

      - name: (macos) build + install fakelua
        if: runner.os == 'macOS'
        run: |
          set -eux
          cmake -S "$RUNNER_TEMP/fakelua-src" -B "$RUNNER_TEMP/flbuild" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFAKELUA_BUILD_TESTS=OFF \
            -DFAKELUA_BUILD_BENCHMARKS=OFF \
            -DCMAKE_PREFIX_PATH="$OPENSSL_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$FLINSTALL"
          cmake --build "$RUNNER_TEMP/flbuild" --parallel
          cmake --install "$RUNNER_TEMP/flbuild"
          ccache -s || true

      - name: (windows) checkout + build fakelua
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          ccache --max-size=2G || true
          git clone --no-checkout https://github.com/esrrhs/fakelua ../fakelua-src
          git -C ../fakelua-src fetch --depth 1 origin "$FAKELUA_REF"
          git -C ../fakelua-src checkout FETCH_HEAD
          cmake -S ../fakelua-src -B ../flbuild -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFAKELUA_BUILD_TESTS=OFF \
            -DFAKELUA_BUILD_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX="$FLINSTALL"
          cmake --build ../flbuild --parallel
          cmake --install ../flbuild
          ccache -s || true

      - name: Configure fake2d (macos)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dfakelua_DIR="$FLINSTALL/lib/cmake/fakelua"

      - name: (windows) configure fake2d
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dfakelua_DIR="$FLINSTALL/lib/cmake/fakelua"

      - name: Build fake2d (macos)
        if: runner.os == 'macOS'
        run: cmake --build build --parallel

      - name: (windows) build fake2d
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Binary smoke
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f build/bin/fake2d_hello.exe
          else
            test -x build/bin/fake2d_hello
          fi

      - name: (windows) assemble tinycc win32 support tree
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          # Statically-linked libtcc has no CONFIG_TCCDIR on win32: at
          # runtime it resolves {B} to the executable's directory
          # (flua.exe), searching ./include, ./include/winapi and ./lib.
          # Populate those from the tinycc install + MinGW/GCC runtime.
          TCC=../flbuild/third_party/tinycc
          BLD=../flbuild/third_party/tinycc_build
          FLBIN="$(cygpath -u "$FLINSTALL")/bin"
          mkdir -p "$FLBIN/include" "$FLBIN/lib"
          cp -f "$TCC/include/"*.h "$FLBIN/include/"
          cp -f "$BLD/tcclib.h" "$FLBIN/include/" 2>/dev/null || true
          # Every system include dir gcc itself reports (CRT headers in
          # /mingw64/include incl. winapi/, compiler stdarg/stddef under
          # lib/gcc/.../include).
          gcc -E -Wp,-v -xc /dev/null 2>&1 | sed -n 's/^ \(.*\)/\1/p' | \
          while read -r d; do
            [ -d "$d" ] && cp -rf "$d/." "$FLBIN/include/" || true
          done
          # tcc's win32/include shims (vadefs.h, _mingw.h, assert.h, ...)
          # must override the current MinGW CRT headers, then the tcc root
          # overrides (stdarg/stddef/tcclib) last.
          cp -rf "$BLD/win32/include/." "$FLBIN/include/"
          cp -f "$TCC/include/"*.h "$FLBIN/include/"
          ls "$FLBIN/include/assert.h" "$FLBIN/include/stdio.h" \
             "$FLBIN/include/stdarg.h" "$FLBIN/include/vadefs.h"
          test -f "$FLBIN/include/windows.h" -o \
               -f "$FLBIN/include/winapi/windows.h"
          cp -f "$BLD/win32/lib/"*.def "$FLBIN/lib/"
          find "$BLD" -maxdepth 2 -name "*libtcc1*.a" -exec cp -f {} "$FLBIN/lib/" \;
          ls "$FLBIN/lib" | head -20

      - name: Download generated demo maps
        uses: actions/download-artifact@v4
        with:
          name: demo-assets
          path: assets

      - name: Headless Lua fixtures (macos)
        if: runner.os == 'macOS'
        run: |
          python3 tests/headless/run_headless.py \
            --flua "$FLINSTALL/bin/flua"

      # Pure-CPU physics queries (no GL needed): C++ exit-code self-test plus
      # the Lua binding test through the CGL headless path.
      - name: (macos) physics query tests
        if: runner.os == 'macOS'
        run: |
          set -eux
          export DYLD_LIBRARY_PATH="$FLINSTALL/lib:${DYLD_LIBRARY_PATH:-}"
          ./build/bin/fake2d_hello --phys-query-test
          ./build/bin/fake2d_hello --phys-filter-test
          ./build/bin/fake2d_hello --phys-rigid-test
          ./build/bin/fake2d_hello --phys-extended-test
          ./build/bin/fake2d_hello --headless --angry-birds-demo --frames 120
          ./build/bin/fake2d_hello --headless --limbo-demo --frames 120
          ./build/bin/fake2d_hello --tile-test
          ./build/bin/fake2d_hello --timestep-test
          ./build/bin/fake2d_hello --path-test
          ./build/bin/fake2d_hello --rt-test
          ./build/bin/fake2d_hello --ui-test
          ./build/bin/fake2d_hello --post-test
          ./build/bin/fake2d_hello --fx-test
          ./build/bin/fake2d_hello --fog-test
          ./build/bin/fake2d_hello --audio-test
          ./build/bin/fake2d_hello --map-object-test
          ./build/bin/fake2d_hello --font-test
          ./build/bin/fake2d_hello --platform-test
          ./build/bin/fake2d_hello --gameplay-test
          ./build/bin/fake2d_hello --combat-test
          ./build/bin/fake2d_hello --shmup-test
          ./build/bin/fake2d_hello --art-test
          ./build/bin/fake2d_hello --launcher-test
          ./build/bin/fake2d_hello --snooker-test
          ./build/bin/fake2d_hello --contra-test
          ./build/bin/fake2d_hello --city-test
          ./build/bin/fake2d_hello --rts-test
          ./build/bin/fake2d_hello --vn-test
          ./build/bin/fake2d_hello --headless --frames 180 --beat-em-up-demo
          ./build/bin/fake2d_hello --headless --frames 180 --shmup-demo
          ./build/bin/fake2d_hello --headless --frames 180 --snooker-demo
          ./build/bin/fake2d_hello --headless --frames 180 --contra-demo
          ./build/bin/fake2d_hello --headless --frames 600 --city-demo
          ./build/bin/fake2d_hello --headless --frames 600 --rts-demo
          ./build/bin/fake2d_hello --headless --frames 600 --vn-demo
          ./build/bin/fake2d_hello --headless --phys-bench
          ./build/bin/fake2d_hello --headless --frames 200 \
            --entry scripts/phys_test.lua > phys_test.log 2>&1
          grep -F "[script] 0" phys_test.log
          ! grep -E "\[script] (10[0-9][0-9]|200[0-9])" phys_test.log

      # macOS runners expose no NSGL pixel format (GLFW 65545), but the CGL
      # headless fallback (no-drawable context + offscreen FBO, GL 2.1 legacy
      # path) renders for real on the Apple Software Renderer. Start
      # continue-on-error; promote to a required gate once proven stable.
      - name: (macos) headless GPU smoke via CGL FBO
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set -eux
          export DYLD_LIBRARY_PATH="$FLINSTALL/lib:${DYLD_LIBRARY_PATH:-}"
          ./build/bin/fake2d_hello --headless --frames 90 --scene-demo \
            --screenshot scene-mac.png
          test -s scene-mac.png
          ./build/bin/fake2d_hello --headless --frames 120 --tile-demo
          ./build/bin/fake2d_hello --headless --frames 120 --map-demo
          ./build/bin/fake2d_hello --headless --frames 180 --platformer-demo
          ./build/bin/fake2d_hello --headless --frames 180 --mario-demo
          ./build/bin/fake2d_hello --headless --frames 120 --slope-demo
          ./build/bin/fake2d_hello --headless --frames 120 --path-demo
          ./build/bin/fake2d_hello --headless --frames 120 --rt-demo
          ./build/bin/fake2d_hello --headless --frames 120 --ui-demo
          ./build/bin/fake2d_hello --headless --frames 120 --ui2-demo
          ./build/bin/fake2d_hello --headless --frames 120 --ui3-demo
          ./build/bin/fake2d_hello --headless --frames 120 --post-demo
          ./build/bin/fake2d_hello --headless --frames 120 --fx-demo
          ./build/bin/fake2d_hello --headless --frames 120 --fog-demo
          ./build/bin/fake2d_hello --headless --frames 120 --audio-demo
          ./build/bin/fake2d_hello --headless --frames 120 --spatial-demo
          ./build/bin/fake2d_hello --headless --frames 60 --text-demo \
            --screenshot text-mac.png --shot-min-colors 12
          test -s text-mac.png

      - name: (windows) headless Lua fixtures
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          # mingw64/bin on PATH gives the gcc jit backend its compiler;
          # flinstall/bin provides libfakelua.dll next to flua.exe.
          FLBIN="$(cygpath -u "$FLINSTALL")/bin"
          export PATH="$FLBIN:$PATH"
          python tests/headless/run_headless.py \
            --flua "$(cygpath -w "$FLBIN/flua.exe")"

      # Software OpenGL (llvmpipe): GitHub Windows VMs expose no hardware GL.
      - name: (windows) install Mesa llvmpipe next to the binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/setup-mesa-windows.ps1 `
            -TargetDir build/bin

      - name: (windows) headless GPU smoke via llvmpipe
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -eux
          export PATH="$(cygpath -u "$FLINSTALL")/bin:$PATH"
          # Pure-CPU physics query self-test (exit code) + Lua binding test.
          ./build/bin/fake2d_hello.exe --phys-query-test
          ./build/bin/fake2d_hello.exe --phys-filter-test
          ./build/bin/fake2d_hello.exe --phys-rigid-test
          ./build/bin/fake2d_hello.exe --phys-extended-test
          ./build/bin/fake2d_hello.exe --headless --angry-birds-demo --frames 120
          ./build/bin/fake2d_hello.exe --headless --limbo-demo --frames 120
          ./build/bin/fake2d_hello.exe --tile-test
          ./build/bin/fake2d_hello.exe --timestep-test
          ./build/bin/fake2d_hello.exe --path-test
          ./build/bin/fake2d_hello.exe --rt-test
          ./build/bin/fake2d_hello.exe --ui-test
          ./build/bin/fake2d_hello.exe --post-test
          ./build/bin/fake2d_hello.exe --fx-test
          ./build/bin/fake2d_hello.exe --fog-test
          ./build/bin/fake2d_hello.exe --audio-test
          ./build/bin/fake2d_hello.exe --map-object-test
          ./build/bin/fake2d_hello.exe --font-test
          ./build/bin/fake2d_hello.exe --platform-test
          ./build/bin/fake2d_hello.exe --gameplay-test
          ./build/bin/fake2d_hello.exe --combat-test
          ./build/bin/fake2d_hello.exe --shmup-test
          ./build/bin/fake2d_hello.exe --snooker-test
          ./build/bin/fake2d_hello.exe --contra-test
          ./build/bin/fake2d_hello.exe --city-test
          ./build/bin/fake2d_hello.exe --rts-test
          ./build/bin/fake2d_hello.exe --vn-test
          ./build/bin/fake2d_hello.exe --headless --frames 180 --beat-em-up-demo
          ./build/bin/fake2d_hello.exe --headless --frames 180 --shmup-demo
          ./build/bin/fake2d_hello.exe --headless --frames 180 --snooker-demo
          ./build/bin/fake2d_hello.exe --headless --frames 180 --contra-demo
          ./build/bin/fake2d_hello.exe --headless --frames 600 --city-demo
          ./build/bin/fake2d_hello.exe --headless --frames 600 --rts-demo
          ./build/bin/fake2d_hello.exe --headless --frames 600 --vn-demo
          ./build/bin/fake2d_hello.exe --headless --frames 200 \
            --entry scripts/phys_test.lua > phys_test.log 2>&1
          grep -F "[script] 0" phys_test.log
          ! grep -E "\[script] (10[0-9][0-9]|200[0-9])" phys_test.log
          ./build/bin/fake2d_hello.exe --headless --frames 30 --scene-demo
          ./build/bin/fake2d_hello.exe --headless --frames 40 --scene-demo \
            --screenshot scene.png
          test -s scene.png
          ./build/bin/fake2d_hello.exe --headless --frames 120 --tile-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --map-demo
          ./build/bin/fake2d_hello.exe --headless --frames 180 --platformer-demo
          ./build/bin/fake2d_hello.exe --headless --frames 180 --mario-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --slope-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --path-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --rt-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --ui-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --ui2-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --ui3-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --post-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --fx-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --fog-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --audio-demo
          ./build/bin/fake2d_hello.exe --headless --frames 120 --spatial-demo
