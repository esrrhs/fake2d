name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# Pinned fakelua commit (post-v2.0.0 master). Heavy deps (boost, libevent,
# hiredis, mariadb connector, tinycc, ...) are fetched by CPM; only OpenSSL
# and a C++23 compiler are expected from the runner/system packages.
env:
  FAKELUA_REF: 608154182155ab34216d20ad3fad624ae65004cf

jobs:
  engine:
    name: engine (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
          - os: macos-15
            label: macos
          - os: windows-2022
            label: windows

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------ Linux
      - name: (linux) packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache xvfb \
            libssl-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev

      - name: (linux) ccache
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.label }}-fakelua
          max-size: 2G

      - name: (linux/mac) caches + paths
        if: runner.os != 'Windows'
        run: |
          echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"
          echo "FLINSTALL=$RUNNER_TEMP/flinstall" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/CPM"

      - name: (linux/mac) cache CPM
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: ${{ runner.os }}-cpm-v2
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: (macos) packages
        if: runner.os == 'macOS'
        run: |
          brew --version
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja ccache openssl@3 || true
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: (macos) ccache
        if: runner.os == 'macOS'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.label }}-fakelua
          max-size: 2G

      # ---------------------------------------------------------- Windows
      - name: (windows) MSYS2 toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-python

      - name: (windows) paths
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          mkdir -p .cache/CPM .cache/ccache
          echo "CPM_SOURCE_CACHE=$(cygpath -w "$GITHUB_WORKSPACE/.cache/CPM")" >> "$GITHUB_ENV"
          echo "FLINSTALL=$(cygpath -w "$GITHUB_WORKSPACE/../flinstall")" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$(cygpath -w "$GITHUB_WORKSPACE/.cache/ccache")" >> "$GITHUB_ENV"

      - name: (windows) cache CPM/ccache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .cache
          key: windows-cpm-ccache-v2
          restore-keys: |
            windows-cpm-ccache-

      # -------------------------------------------------- fakelua (linux/mac)
      - name: (linux/mac) checkout fakelua
        if: runner.os != 'Windows'
        run: |
          git clone --no-checkout https://github.com/esrrhs/fakelua "$RUNNER_TEMP/fakelua-src"
          git -C "$RUNNER_TEMP/fakelua-src" fetch --depth 1 origin "$FAKELUA_REF"
          git -C "$RUNNER_TEMP/fakelua-src" checkout FETCH_HEAD

      - name: (linux/mac) build + install fakelua
        if: runner.os != 'Windows'
        run: |
          set -eux
          common="-S $RUNNER_TEMP/fakelua-src -B $RUNNER_TEMP/flbuild -G Ninja
                  -DCMAKE_BUILD_TYPE=Release
                  -DFAKELUA_BUILD_TESTS=OFF
                  -DFAKELUA_BUILD_BENCHMARKS=OFF
                  -DCMAKE_INSTALL_PREFIX=$FLINSTALL"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake $common -DCMAKE_PREFIX_PATH="$OPENSSL_PREFIX"
          else
            cmake $common
          fi
          cmake --build "$RUNNER_TEMP/flbuild" --parallel
          cmake --install "$RUNNER_TEMP/flbuild"
          ccache -s || true

      # ------------------------------------------------ fakelua (windows)
      - name: (windows) checkout + build fakelua
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          ccache --max-size=2G || true
          git clone --no-checkout https://github.com/esrrhs/fakelua ../fakelua-src
          git -C ../fakelua-src fetch --depth 1 origin "$FAKELUA_REF"
          git -C ../fakelua-src checkout FETCH_HEAD
          cmake -S ../fakelua-src -B ../flbuild -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFAKELUA_BUILD_TESTS=OFF \
            -DFAKELUA_BUILD_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX="$FLINSTALL"
          cmake --build ../flbuild --parallel
          cmake --install ../flbuild
          ccache -s || true

      # ------------------------------------------------------------- fake2d
      - name: Configure fake2d (linux/mac)
        if: runner.os != 'Windows'
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dfakelua_DIR="$FLINSTALL/lib/cmake/fakelua"

      - name: (windows) configure fake2d
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dfakelua_DIR="$FLINSTALL/lib/cmake/fakelua"

      - name: Build fake2d (linux/mac)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: (windows) build fake2d
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Binary smoke
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f build/bin/fake2d_hello.exe
          else
            test -x build/bin/fake2d_hello
          fi
          echo "binary ok"

      # ---- Generate assets (PNGs/JSON maps are produced on first run) ----
      - name: (linux) generate demo assets
        if: runner.os == 'Linux'
        run: |
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          for demo in mario platformer slope; do
            xvfb-run -a -s '-screen 0 1024x768x24' \
              env LIBGL_ALWAYS_SOFTWARE=1 \
              ./build/bin/fake2d_hello --headless --frames 1 "--$demo-demo"
          done
          test -s assets/mario.json && test -s assets/platformer.json \
            && test -s assets/slope.json

      # GitHub's macOS runners expose no OpenGL pixel format (NSGL 65545),
      # and Windows VMs may lack a GL 3.3 WGL pixel format, so the JSON
      # levels are produced once on Linux (llvmpipe) and shared as an
      # artifact for the fixture-only runs on the other two OSes.
      - name: Upload generated demo maps
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: demo-assets
          path: |
            assets/mario.json
            assets/platformer.json
            assets/slope.json

      - name: Download generated demo maps
        if: runner.os != 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: demo-assets
          path: assets

      # ----------------------- Lua gameplay logic (all platforms/backends)
      - name: Headless Lua gameplay fixtures tcc/gcc/interp (linux/mac)
        if: runner.os != 'Windows'
        run: |
          python3 tests/headless/run_headless.py \
            --flua "$FLINSTALL/bin/flua"

      - name: (windows) headless Lua gameplay fixtures tcc/gcc/interp
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          # mingw64/bin on PATH gives the gcc jit backend its compiler;
          # flinstall/bin provides libfakelua.dll next to flua.exe.
          FLBIN="$(cygpath -u "$FLINSTALL")/bin"
          export PATH="$FLBIN:$PATH"
          python tests/headless/run_headless.py \
            --flua "$(cygpath -w "$FLBIN/flua.exe")" \
            --jit 2 --scenario mario_smoke

      # ------------------------- GPU/demo smoke (hidden/software contexts)
      - name: (linux) headless demo + benchmark smoke
        if: runner.os == 'Linux'
        run: |
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          xvfb-run -a -s '-screen 0 1024x768x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/bin/fake2d_hello --headless --frames 30 --scene-demo
          xvfb-run -a -s '-screen 0 1024x768x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/bin/fake2d_hello --headless --frames 40 --scene-demo \
              --screenshot scene.png
          test -s scene.png
          xvfb-run -a -s '-screen 0 1024x768x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/bin/fake2d_hello --headless --bench
          xvfb-run -a -s '-screen 0 1024x768x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/bin/fake2d_hello --headless --frames 120 --map-demo
          xvfb-run -a -s '-screen 0 1024x768x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/bin/fake2d_hello --headless --frames 180 --platformer-demo
          xvfb-run -a -s '-screen 0 1024x768x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/bin/fake2d_hello --headless --frames 180 --mario-demo
          xvfb-run -a -s '-screen 0 1024x768x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/bin/fake2d_hello --headless --frames 120 --slope-demo
          xvfb-run -a -s '-screen 0 1024x768x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            ./build/bin/fake2d_hello --headless --phys-bench

      # macOS: no GPU smoke — GitHub macOS VMs cannot create an NSOpenGL
      # pixel format (GLFW 65545), same class of limitation as local
      # virtualization. Build + the 24 Lua logic cases are the gate there.

      - name: (windows) hidden-context GPU smoke (non-blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: msys2 {0}
        run: |
          set -eux
          export PATH="$(cygpath -u "$FLINSTALL")/bin:$PATH"
          ./build/bin/fake2d_hello.exe --headless --frames 30 --scene-demo
          ./build/bin/fake2d_hello.exe --headless --frames 180 --mario-demo
