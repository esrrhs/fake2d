name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# Cancel a superseded Build on the same branch or PR only. This does not
# touch release.yml or runs on a different ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pinned fakelua commit (post-v2.0.0 master; must include fakelua #33 for `flua --once`). It must also
# permit native table mutation: the demos keep their cross-frame state in a
# new_global_obj NativeObject, and older FakeLua rejects those writes with
# "attempt to modify a const table". Heavy deps (boost, libevent,
# hiredis, mariadb connector, tinycc, ...) are fetched by CPM; only OpenSSL
# and a C++23 compiler are expected from the runner/system packages.
env:
  FAKELUA_REF: 9f7216e0e9904d7cd05bbc4109fc22caf6ca57da

jobs:
  # Short Linux job that only produces the generated demo maps. macOS and
  # Windows need these files, but they must not wait for the full Linux test
  # gate (historically 16-31 minutes). linux-tests starts in parallel and
  # generates its own maps.
  assets:
    name: linux assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache xvfb \
            libssl-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev patchelf fonts-noto-cjk

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-fakelua
          max-size: 2G

      - name: Cache paths
        run: |
          echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"
          echo "FLINSTALL=$GITHUB_WORKSPACE/.deps/fakelua-prefix" >> "$GITHUB_ENV"
          echo "FAKELUA_SRC=$RUNNER_TEMP/fakelua-src" >> "$GITHUB_ENV"
          echo "FAKELUA_BUILD=$RUNNER_TEMP/flbuild" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/CPM"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: Linux-cpm-v2
          restore-keys: |
            Linux-cpm-

      - name: Fakelua cache identity
        run: tools/ci_fakelua.sh identity

      - uses: actions/cache@v4
        with:
          path: .deps/fakelua-prefix
          key: ${{ env.FAKELUA_CACHE_KEY }}

      - name: Build + install fakelua
        run: tools/ci_fakelua.sh install

      - name: Configure fake2d
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dfakelua_DIR="$FLINSTALL/lib/cmake/fakelua"

      - name: Build fake2d
        run: cmake --build build --parallel

      - name: Binary smoke
        run: test -x build/bin/fake2d_hello

      - name: Generate demo assets
        run: |
          # One pass materializes the whole first-run asset tree, so packages
          # and the demo runs below never rely on the host filling gaps in.
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          ./build/bin/fake2d_hello --generate-assets
          test -s assets/mario.json && test -s assets/platformer.json \
            && test -s assets/slope.json && test -s assets/vn/bg/gate.png

      - uses: actions/upload-artifact@v4
        with:
          name: demo-assets
          path: |
            assets/mario.json
            assets/platformer.json
            assets/slope.json

  # Full Linux gate. Starts immediately (no needs: assets) so it does not
  # wait for the short assets job. Uses the same shared test entry points
  # as macOS/Windows; long gameplay milestone screenshots and staged-package
  # verify-package stay here.
  linux-tests:
    name: linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache xvfb \
            libssl-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev patchelf fonts-noto-cjk

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-fakelua
          max-size: 2G

      - name: Cache paths
        run: |
          echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"
          echo "FLINSTALL=$GITHUB_WORKSPACE/.deps/fakelua-prefix" >> "$GITHUB_ENV"
          echo "FAKELUA_SRC=$RUNNER_TEMP/fakelua-src" >> "$GITHUB_ENV"
          echo "FAKELUA_BUILD=$RUNNER_TEMP/flbuild" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/CPM"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: Linux-cpm-v2
          restore-keys: |
            Linux-cpm-

      - name: Fakelua cache identity
        run: tools/ci_fakelua.sh identity

      - uses: actions/cache@v4
        with:
          path: .deps/fakelua-prefix
          key: ${{ env.FAKELUA_CACHE_KEY }}

      - name: Build + install fakelua
        run: tools/ci_fakelua.sh install

      - name: Configure fake2d
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dfakelua_DIR="$FLINSTALL/lib/cmake/fakelua"

      - name: Build fake2d
        run: cmake --build build --parallel

      - name: Binary smoke
        run: test -x build/bin/fake2d_hello

      - name: Generate demo assets
        run: |
          # One pass materializes the whole first-run asset tree, so packages
          # and the demo runs below never rely on the host filling gaps in.
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          ./build/bin/fake2d_hello --generate-assets
          test -s assets/mario.json && test -s assets/platformer.json \
            && test -s assets/slope.json && test -s assets/vn/bg/gate.png

      # Compile the Steamworks branch against tests/fake_steam: the SDK code
      # path must stay buildable even though CI has no proprietary SDK.
      - name: Steamworks adapter header check
        run: |
          cmake -S . -B "$RUNNER_TEMP/steam-check" -G Ninja \
            -DFAKE2D_WITH_FAKELUA=OFF \
            -DFAKE2D_BUILD_EXAMPLES=OFF \
            -DFAKE2D_TEST_STEAM_HEADERS=ON
          cmake --build "$RUNNER_TEMP/steam-check" \
            --target fake2d_steam_compile_check

      - name: Every demo script runs
        run: |
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          # Shared catalog scan (tools/run_demo_scripts.py), also required on
          # macOS and Windows. CompileFile still warns and continues without a
          # script (zero exit), so the runner scans the log for syntax error /
          # CompileFile failed / update() failed as well as the exit code.
          # Engine::Run already returns non-zero after update() throws; the
          # --entry update_fail_test.lua inverse gate below keeps that contract.
          # Frames 400 under --ai because that is roughly where the attract AI
          # first kills something; the interpreter because the JIT would add
          # ~20 minutes to compile the catalog, and the GPU smoke / UI demo
          # gates already exercise it.
          python3 tools/run_demo_scripts.py --frames 400 --interp --ai


      - name: Headless Lua gameplay fixtures (tcc/gcc/interp)
        run: |
          python3 tests/headless/run_headless.py \
            --flua "$FLINSTALL/bin/flua"

      - name: Headless demo + benchmark smoke
        run: |
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          # Shared JIT/GL smoke (tools/run_gpu_smoke.py --profile core).
          # Dynamic UI layout/features/variable/stress metric and screenshot
          # acceptance is tools/check_ui_demos.py, run by the docs gate next
          # (Linux) and as a required step on macOS/Windows. Long gameplay
          # milestones stay in the screenshot-gates step below.
          python3 tools/run_gpu_smoke.py --profile core

      - name: Headless test suites (ctest)
        run: |
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          # Shared CTest set also required on macOS and Windows: the 31
          # --<suite>-test binaries, both UI stress seeds (42 / 1492026),
          # --ui-bench counter gates, and fake2d-win-macro-compat. On Linux
          # the CMake registration wraps every case in xvfb-run when available.
          # Keep passed-test stdout in the log (default passed-output cap is
          # 1 KiB and would truncate the trailing PASS: N checks line).
          ctest --test-dir build --output-on-failure --output-log build/ctest.log \
            --verbose --test-output-size-passed 10485760 --test-output-size-failed 10485760

      - name: Docs counts match the code
        run: |
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          # Re-count from the ctest log (do not re-run the 31 suites) and
          # compare headline numbers against demos.h / entity_store.h / the
          # CMake suite list. Dynamic UI demo acceptance still runs here.
          python3 tools/check-docs.py --ctest-log build/ctest.log

      - name: Demo smoke + screenshot gates
        run: |
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          # Headless still glfwInit()s on Linux, so every engine invocation
          # needs the Xvfb/llvmpipe wrapper.
          run_xvfb() {
            xvfb-run -a -s '-screen 0 1024x768x24' env LIBGL_ALWAYS_SOFTWARE=1 "$@"
          }
          # Every run pins the simulation clock (--fixed-sim-dt): one rendered
          # frame is exactly 1/60 s of gameplay, so `--frames N` means N/60 s
          # on every host. Without it llvmpipe's frame rate silently decides
          # how much game time a gate gets, which is why a slow runner once
          # reported "game over" at a frame count that was a few seconds of
          # play locally, and a fast runner could end a shot still rolling.
          set +e
          # Angry Birds demo smoke: slingshot, stacks, contact-driven scoring.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --angry-birds-demo --frames 240 > birds.log 2>&1
          rc_birds=$?
          # LIMBO demo smoke: ragdoll + rope + bridge + water + severing.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --limbo-demo --frames 240 > limbo.log 2>&1
          rc_limbo=$?
          # LIMBO walk gate: the doll has to stay upright, stand at standing
          # height, cover ground AND open its legs. A ragdoll towed along on
          # two frozen poles passes all of the first three -- the sliding the
          # eye catches instantly, so the log has to say the stride happened.
          # The env var goes through `env` rather than a prefix because
          # run_xvfb is a shell function.
          run_xvfb env LIMBO_TEST=2 ./build/bin/fake2d_hello --headless --fixed-sim-dt \
            --limbo-demo --frames 300 --screenshot limbo_walk.png \
            --shot-frame 180 --shot-min-colors 12 > limbo_walk.log 2>&1
          rc_limbo_walk=$?
          test -s limbo_walk.png
          # Lighting performance gate (exit code gate): the pass must stay
          # batched -- draw calls flat in the light count -- and must hold its
          # geometry to the budget. Gated on work submitted, not wall clock,
          # because these runners use software GL. Not a --test suite, so it
          # stays out of ctest.
          run_xvfb ./build/bin/fake2d_hello --light-bench > light_bench.log 2>&1
          rc_light_bench=$?
          # Rigged soldier demo: clip switching, IK aim, event-driven effects.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --frames 240 \
            --skeleton-demo --screenshot skeleton.png --shot-frame 150 \
            --shot-min-colors 12 > skeleton_demo.log 2>&1
          rc_skeleton_demo=$?
          test -s skeleton.png
          # A script that throws on every frame still exits 0, so this gate
          # reads the log as well: one error line folds into the demo's rc.
          grep -q "update() failed" skeleton_demo.log
          [ "$?" -ne 0 ] || rc_skeleton_demo=1
          # Soft-skinned mesh demo: weighted flag + deform flutter.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --frames 240 \
            --skeleton-mesh-demo --screenshot skeleton_mesh.png --shot-frame 150 \
            --shot-min-colors 8 > skeleton_mesh_demo.log 2>&1
          rc_skeleton_mesh_demo=$?
          test -s skeleton_mesh.png
          grep -q "update() failed" skeleton_mesh_demo.log
          [ "$?" -ne 0 ] || rc_skeleton_mesh_demo=1
          # Soft-skin + lighting: hull occluder under the Phase 46 pass.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --frames 240 \
            --skeleton-light-demo --screenshot skeleton_light.png --shot-frame 150 \
            --shot-min-colors 8 > skeleton_light_demo.log 2>&1
          rc_skeleton_light_demo=$?
          test -s skeleton_light.png
          grep -q "update() failed" skeleton_light_demo.log
          [ "$?" -ne 0 ] || rc_skeleton_light_demo=1
          # Inverse gate: intentional update() failure must exit non-zero
          # (Phase 47 exit-code work). Keep it short and reliable.
          # (This step already runs under set +e so a non-zero child is fine.)
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --interp \
            --entry scripts/update_fail_test.lua --frames 3 \
            > update_fail.log 2>&1
          rc_update_fail=$?
          if [ "$rc_update_fail" -eq 0 ]; then
            echo "::error::update_fail_test.lua should exit non-zero"
            rc_update_fail=1
          else
            rc_update_fail=0
          fi
          grep -q "update() failed" update_fail.log
          [ "$?" -eq 0 ] || rc_update_fail=1
          # Lighting showcase: torches, a carried lantern and sliding crates
          # whose shadows move with them.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --frames 240 \
            --light-demo --screenshot light.png --shot-frame 150 \
            --shot-min-colors 12 > light_demo.log 2>&1
          rc_light_demo=$?
          test -s light.png
          # Launcher: the menu renders from shipped art, and a picked demo
          # requests the relaunch the host would honour with a fresh process.
          LAUNCHER_TEST_PICK=3 run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --frames 40 \
            --launcher --screenshot launcher.png --shot-min-colors 12 \
            > launcher_demo.log 2>&1
          rc_launcher_demo=$?
          test -s launcher.png
          # Filtering narrows the list, and a row click commits what it covers.
          LAUNCHER_TEST_CAT=2 LAUNCHER_TEST_PICK=0 run_xvfb ./build/bin/fake2d_hello \
            --headless --fixed-sim-dt --frames 40 --launcher > launcher_filter.log 2>&1
          rc_launcher_filter=$?
          LAUNCHER_TEST_MX=100 LAUNCHER_TEST_MY=241 LAUNCHER_TEST_CLICK=10 run_xvfb \
            ./build/bin/fake2d_hello --headless --fixed-sim-dt --frames 40 --launcher \
            > launcher_click.log 2>&1
          rc_launcher_click=$?
          # Brawler demo: waves, hit detection and a full headless stage run.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --ai --frames 240 \
            --beat-em-up-demo --screenshot beat.png --shot-min-colors 12 \
            > beat.log 2>&1
          rc_beat=$?
          test -s beat.png
          # A script error does not move the exit code; read the log.
          if grep -q "update() failed" beat.log; then rc_beat=1; fi
          # Vertical shooter: scrolling stage, waves and bullet patterns.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --ai --frames 240 \
            --shmup-demo --screenshot shmup.png --shot-min-colors 12 \
            > shmup_demo.log 2>&1
          rc_shmup_demo=$?
          test -s shmup.png
          if grep -q "update() failed" shmup_demo.log; then rc_shmup_demo=1; fi
          # Snooker: a full rack, cue strike, cushions, pockets and the AI.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --ai --frames 900 \
            --snooker-demo --screenshot snooker.png --shot-frame 500 \
            --shot-min-colors 12 > snooker_demo.log 2>&1
          rc_snooker_demo=$?
          test -s snooker.png
          # Run-and-gun: the attract AI crosses the jungle, clears the boss and
          # loops the stage; the log proves the whole stage flow ran.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --ai --frames 2500 \
            --contra-demo --screenshot contra.png --shot-frame 1800 \
            --shot-min-colors 12 > contra_demo.log 2>&1
          rc_contra_demo=$?
          test -s contra.png
          if grep -q "update() failed" contra_demo.log; then rc_contra_demo=1; fi
          if grep -q "update() failed" snooker_demo.log; then rc_snooker_demo=1; fi
          # City builder: the attract mayor paves, zones and powers a town; a
          # population milestone proves the monthly simulation is developing it.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --ai --frames 1800 \
            --city-demo --screenshot city.png --shot-frame 1600 \
            --shot-min-colors 12 > city_demo.log 2>&1
          rc_city_demo=$?
          test -s city.png
          if grep -q "update() failed" city_demo.log; then rc_city_demo=1; fi
          # RTS: the attract commander and enemy AI fight a full match; the
          # logs prove combat, losses and a decisive command-yard kill.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --ai --frames 2400 \
            --rts-demo --screenshot rts.png --shot-frame 1950 \
            --shot-min-colors 12 > rts_demo.log 2>&1
          rc_rts_demo=$?
          test -s rts.png
          if grep -q "update() failed" rts_demo.log; then rc_rts_demo=1; fi
          # Visual novel: the attract player advances the calendar, chats,
          # reaches the festival and finishes a confession ending.
          run_xvfb ./build/bin/fake2d_hello --headless --fixed-sim-dt --ai --frames 2400 \
            --vn-demo --screenshot vn.png --shot-frame 1200 \
            --shot-min-colors 12 > vn_demo.log 2>&1
          rc_vn_demo=$?
          test -s vn.png
          if grep -q "update() failed" vn_demo.log; then rc_vn_demo=1; fi
          set -e
          echo "exit codes: birds=$rc_birds limbo=$rc_limbo limbowalk=$rc_limbo_walk lightbench=$rc_light_bench lightdemo=$rc_light_demo skeldemo=$rc_skeleton_demo skelmesh=$rc_skeleton_mesh_demo skellight=$rc_skeleton_light_demo updatefail=$rc_update_fail launcher=$rc_launcher_demo launcherfilter=$rc_launcher_filter launcherclick=$rc_launcher_click beat=$rc_beat shmupdemo=$rc_shmup_demo snookerdemo=$rc_snooker_demo contrademo=$rc_contra_demo citydemo=$rc_city_demo rtsdemo=$rc_rts_demo vndemo=$rc_vn_demo"
          [ "$rc_birds" -eq 0 ]
          [ "$rc_limbo" -eq 0 ]
          [ "$rc_limbo_walk" -eq 0 ]
          [ "$rc_light_bench" -eq 0 ]
          [ "$rc_light_demo" -eq 0 ]
          [ "$rc_skeleton_demo" -eq 0 ]
          [ "$rc_skeleton_mesh_demo" -eq 0 ]
          [ "$rc_skeleton_light_demo" -eq 0 ]
          [ "$rc_update_fail" -eq 0 ]
          [ "$rc_launcher_demo" -eq 0 ]
          [ "$rc_launcher_filter" -eq 0 ]
          [ "$rc_launcher_click" -eq 0 ]
          [ "$rc_beat" -eq 0 ]
          [ "$rc_shmup_demo" -eq 0 ]
          [ "$rc_snooker_demo" -eq 0 ]
          [ "$rc_contra_demo" -eq 0 ]
          [ "$rc_city_demo" -eq 0 ]
          [ "$rc_rts_demo" -eq 0 ]
          [ "$rc_vn_demo" -eq 0 ]
          grep -F "limbo: walk PASS" limbo_walk.log
          grep -F "[light-bench] PASS" light_bench.log
          grep -F "lighting: " light_demo.log
          grep -F "launcher: starting platformer" launcher_demo.log
          grep -F "would restart with --platformer-demo" launcher_demo.log
          grep -F "launcher: filter engine" launcher_filter.log
          grep -F "launcher: starting skeleton" launcher_filter.log
          grep -F "launcher: starting beat-em-up" launcher_click.log
          ! grep -F "beat-em-up: game over" beat.log
          grep -F "snooker: shot 1 resolved" snooker_demo.log
          grep -F "contra: fortress core destroyed" contra_demo.log
          grep -F "city: population milestone 250" city_demo.log
          grep -F "rts: first blood" rts_demo.log
          grep -F "rts: player victory" rts_demo.log
          grep -F "vn: day 7" vn_demo.log
          grep -F "vn: ending" vn_demo.log

      - name: Installed package is consumable by another project
        run: |
          # Shared find_package(fake2d 1.53) consumer (tools/verify-consumer.sh
          # and tools/consumer). The same gate is required on macOS and Windows.
          # FakeLua must be findable -- a real requirement on consumers, not a
          # test artifact -- so FLINSTALL is on CMAKE_PREFIX_PATH.
          export CMAKE_PREFIX_PATH="$FLINSTALL"
          export LD_LIBRARY_PATH="$FLINSTALL/lib:${LD_LIBRARY_PATH:-}"
          tools/verify-consumer.sh --build-dir build

      - name: Staged package ships every demo asset
        run: |
          # Gate the actual release artifact, not just the in-tree build: stage
          # the same layout the release workflow ships, then run it from an
          # unrelated working directory with --strict-assets. A missing art file
          # now fails here instead of quietly falling back to a host painter.
          STAGE="$RUNNER_TEMP/fake2d-stage"
          tools/package-linux.sh \
            build/bin/fake2d_hello "$FLINSTALL/lib" "$STAGE"
          tools/verify-package.sh "$STAGE"

  # macOS and Windows build the full fakelua-enabled engine and share the
  # same test entry points as Linux (CTest, tools/check_ui_demos.py,
  # tools/run_demo_scripts.py, tools/run_gpu_smoke.py, tools/verify-consumer.sh)
  # against Linux-produced maps. GitHub macOS VMs have no NSOpenGL pixel
  # format (GLFW 65545); headless runs use the CGL offscreen FBO path and
  # are required gates, not continue-on-error. Windows installs Mesa
  # llvmpipe (tools/setup-mesa-windows.ps1) for software GL. Long gameplay
  # milestone screenshots and staged-package verify-package stay Linux-only.
  engine:
    name: engine (${{ matrix.label }})
    needs: assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos
          - os: windows-2022
            label: windows

    steps:
      - uses: actions/checkout@v4

      - name: (macos) packages
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja ccache openssl@3 || true
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: (macos) ccache
        if: runner.os == 'macOS'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-fakelua
          max-size: 2G

      - name: (macos) cache paths
        if: runner.os == 'macOS'
        run: |
          echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"
          echo "FLINSTALL=$GITHUB_WORKSPACE/.deps/fakelua-prefix" >> "$GITHUB_ENV"
          echo "FAKELUA_SRC=$RUNNER_TEMP/fakelua-src" >> "$GITHUB_ENV"
          echo "FAKELUA_BUILD=$RUNNER_TEMP/flbuild" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/CPM"

      - name: (macos) cache CPM
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: macOS-cpm-v2
          restore-keys: |
            macOS-cpm-

      - name: (windows) MSYS2 toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-python

      - name: (windows) paths
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          mkdir -p .deps .cache/CPM .cache/ccache
          WS=$(cygpath -u "$GITHUB_WORKSPACE")
          echo "CPM_SOURCE_CACHE=$(cygpath -w "$GITHUB_WORKSPACE/.cache/CPM")" >> "$GITHUB_ENV"
          echo "FLINSTALL=$(cygpath -w "$WS/.deps/fakelua-prefix")" >> "$GITHUB_ENV"
          echo "FAKELUA_SRC=$WS/../fakelua-src" >> "$GITHUB_ENV"
          echo "FAKELUA_BUILD=$WS/../flbuild" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$(cygpath -w "$GITHUB_WORKSPACE/.cache/ccache")" >> "$GITHUB_ENV"

      - name: (windows) cache CPM/ccache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .cache
          key: windows-cpm-ccache-v2
          restore-keys: |
            windows-cpm-ccache-

      - name: (macos) fakelua cache identity
        if: runner.os == 'macOS'
        run: tools/ci_fakelua.sh identity

      - name: (macos) cache fakelua install
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: .deps/fakelua-prefix
          key: ${{ env.FAKELUA_CACHE_KEY }}

      - name: (macos) build + install fakelua
        if: runner.os == 'macOS'
        run: tools/ci_fakelua.sh install

      - name: (windows) fakelua cache identity
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          ccache --max-size=2G || true
          tools/ci_fakelua.sh identity

      - name: (windows) cache fakelua install
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .deps/fakelua-prefix
          key: ${{ env.FAKELUA_CACHE_KEY }}

      - name: (windows) build + install fakelua
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: tools/ci_fakelua.sh install

      - name: Configure fake2d (macos)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dfakelua_DIR="$FLINSTALL/lib/cmake/fakelua"

      - name: (windows) configure fake2d
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dfakelua_DIR="$FLINSTALL/lib/cmake/fakelua"

      - name: Build fake2d (macos)
        if: runner.os == 'macOS'
        run: cmake --build build --parallel

      - name: (windows) build fake2d
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Binary smoke
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f build/bin/fake2d_hello.exe
          else
            test -x build/bin/fake2d_hello
          fi

      - name: (windows) assemble tinycc win32 support tree
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          # Statically-linked libtcc has no CONFIG_TCCDIR on win32: at
          # runtime it resolves {B} to the executable's directory
          # (flua.exe), searching ./include, ./include/winapi and ./lib.
          # tools/ci_fakelua.sh now assembles this tree into the prefix
          # before the TCC probe; this step is a leftover check so later
          # fixtures still have the headers if the cache predates that.
          FLBIN="$(cygpath -u "$FLINSTALL")/bin"
          if [ -f "$FLBIN/include/windows.h" ] || [ -f "$FLBIN/include/winapi/windows.h" ]; then
            ls "$FLBIN/include/assert.h" "$FLBIN/include/stdio.h" \
               "$FLBIN/include/stdarg.h" "$FLBIN/include/vadefs.h"
            exit 0
          fi
          TCC="${FAKELUA_BUILD}/third_party/tinycc"
          BLD="${FAKELUA_BUILD}/third_party/tinycc_build"
          mkdir -p "$FLBIN/include" "$FLBIN/lib"
          cp -f "$TCC/include/"*.h "$FLBIN/include/"
          cp -f "$BLD/tcclib.h" "$FLBIN/include/" 2>/dev/null || true
          # Every system include dir gcc itself reports (CRT headers in
          # /mingw64/include incl. winapi/, compiler stdarg/stddef under
          # lib/gcc/.../include).
          gcc -E -Wp,-v -xc /dev/null 2>&1 | sed -n 's/^ \(.*\)/\1/p' | \
          while read -r d; do
            [ -d "$d" ] && cp -rf "$d/." "$FLBIN/include/" || true
          done
          # tcc's win32/include shims (vadefs.h, _mingw.h, assert.h, ...)
          # must override the current MinGW CRT headers, then the tcc root
          # overrides (stdarg/stddef/tcclib) last.
          cp -rf "$BLD/win32/include/." "$FLBIN/include/"
          cp -f "$TCC/include/"*.h "$FLBIN/include/"
          ls "$FLBIN/include/assert.h" "$FLBIN/include/stdio.h" \
             "$FLBIN/include/stdarg.h" "$FLBIN/include/vadefs.h"
          test -f "$FLBIN/include/windows.h" -o \
               -f "$FLBIN/include/winapi/windows.h"
          cp -f "$BLD/win32/lib/"*.def "$FLBIN/lib/"
          find "$BLD" -maxdepth 2 -name "*libtcc1*.a" -exec cp -f {} "$FLBIN/lib/" \;
          ls "$FLBIN/lib" | head -20

      - name: Download generated demo maps
        uses: actions/download-artifact@v4
        with:
          name: demo-assets
          path: assets

      - name: Headless Lua fixtures (macos)
        if: runner.os == 'macOS'
        run: |
          python3 tests/headless/run_headless.py \
            --flua "$FLINSTALL/bin/flua"

      - name: (windows) headless Lua fixtures
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          # mingw64/bin on PATH gives the gcc jit backend its compiler;
          # flinstall/bin provides libfakelua.dll next to flua.exe.
          FLBIN="$(cygpath -u "$FLINSTALL")/bin"
          export PATH="$FLBIN:$PATH"
          python tests/headless/run_headless.py \
            --flua "$(cygpath -w "$FLBIN/flua.exe")"

      # Software OpenGL (llvmpipe): GitHub Windows VMs expose no hardware GL.
      - name: (windows) install Mesa llvmpipe next to the binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/setup-mesa-windows.ps1 `
            -TargetDir build/bin

      # Shared required gates. Same scripts as Linux: CTest (31 suites, both
      # UI stress seeds, ui-bench, win_macro_compat), dynamic UI demo
      # acceptance, catalog script-error scan, JIT/GL smoke, and the 1.53
      # find_package consumer. CGL/llvmpipe failures are blocking.
      - name: Headless test suites (ctest)
        if: runner.os == 'macOS'
        run: |
          export DYLD_LIBRARY_PATH="$FLINSTALL/lib:${DYLD_LIBRARY_PATH:-}"
          ctest --test-dir build --output-on-failure

      - name: (windows) headless test suites (ctest)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -eux
          export PATH="$(cygpath -u "$FLINSTALL")/bin:$PATH"
          ctest --test-dir build --output-on-failure

      - name: Dynamic UI demo acceptance
        if: runner.os == 'macOS'
        run: |
          export DYLD_LIBRARY_PATH="$FLINSTALL/lib:${DYLD_LIBRARY_PATH:-}"
          python3 tools/check_ui_demos.py

      - name: (windows) dynamic UI demo acceptance
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -eux
          export PATH="$(cygpath -u "$FLINSTALL")/bin:$PATH"
          PY=python3; command -v python3 >/dev/null || PY=python
          "$PY" tools/check_ui_demos.py

      - name: Every demo script runs
        if: runner.os == 'macOS'
        run: |
          export DYLD_LIBRARY_PATH="$FLINSTALL/lib:${DYLD_LIBRARY_PATH:-}"
          python3 tools/run_demo_scripts.py --frames 400 --interp --ai

      - name: (windows) every demo script runs
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -eux
          export PATH="$(cygpath -u "$FLINSTALL")/bin:$PATH"
          PY=python3; command -v python3 >/dev/null || PY=python
          "$PY" tools/run_demo_scripts.py --frames 400 --interp --ai

      - name: Headless demo + benchmark smoke
        if: runner.os == 'macOS'
        run: |
          export DYLD_LIBRARY_PATH="$FLINSTALL/lib:${DYLD_LIBRARY_PATH:-}"
          python3 tools/run_gpu_smoke.py --profile extended

      - name: (windows) headless demo + benchmark smoke
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -eux
          export PATH="$(cygpath -u "$FLINSTALL")/bin:$PATH"
          PY=python3; command -v python3 >/dev/null || PY=python
          "$PY" tools/run_gpu_smoke.py --profile extended

      - name: Installed package is consumable by another project
        if: runner.os == 'macOS'
        run: |
          export DYLD_LIBRARY_PATH="$FLINSTALL/lib:${DYLD_LIBRARY_PATH:-}"
          export CMAKE_PREFIX_PATH="$FLINSTALL"
          tools/verify-consumer.sh --build-dir build

      - name: (windows) installed package is consumable by another project
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          export PATH="$(cygpath -u "$FLINSTALL")/bin:$PATH"
          export CMAKE_PREFIX_PATH="$FLINSTALL"
          tools/verify-consumer.sh --build-dir build
